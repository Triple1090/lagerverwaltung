<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)">
<title>Anmelden — Lagerverwaltung</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f0f1f4;
    --card-bg: #ffffff;
    --card-border: #e2e5ea;
    --active-border: #4f46e5;
    --active-bg: #eef2ff;
    --text: #1f2937;
    --muted: #6b7280;
    --err: #dc2626;
    --err-bg: #fee2e2;
    --focus-ring: #4f46e5;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e0f13;
      --card-bg: #1a1c22;
      --card-border: #2c2f38;
      --active-border: #818cf8;
      --active-bg: #221f3d;
      --text: #e8e9ec;
      --muted: #8b8f9a;
      --err: #f87171;
      --err-bg: #3a1618;
      --focus-ring: #818cf8;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .login-card {
    width: 100%;
    max-width: 340px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: var(--shadow);
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  header .logo { width: 26px; height: 26px; color: var(--active-border); flex-shrink: 0; }
  h1 { font-size: 16px; font-weight: 700; margin: 0; text-align: center; }
  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .03em;
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    font-size: 16px;
    padding: 11px 12px;
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    background-color: var(--card-bg);
    color: var(--text);
    font-family: inherit;
  }
  input:focus-visible {
    outline: none;
    border-color: var(--focus-ring);
    box-shadow: 0 0 0 3px var(--active-bg);
  }
  button {
    width: 100%;
    margin-top: 6px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: var(--active-border);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { opacity: 0.85; }
  .error {
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 9px;
    background: var(--err-bg);
    color: var(--err);
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="login-card">
  <header>
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M12 2 4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4Z" stroke-linejoin="round"/>
      <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Lagerverwaltung — Leine Honig</h1>
  </header>
  __ERROR_BLOCK__
  <form method="POST" action="/login">
    <div class="field">
      <label for="username">Benutzername</label>
      <input type="text" id="username" name="username" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Passwort</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit">Anmelden</button>
  </form>
</div>
</body>
</html>
